name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and deterministic route generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      CRON_SECRET: ci-placeholder-secret
      STRUCTURED_LOG_STACKS: "false"
      DCA02_BL2_LIVE_RESTORE_ALLOWED: "false"
      DCA02_BL1_PROVIDER_WRITES_ALLOWED: "false"
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        id: verify-head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "actual_sha=${actual_sha}" >> "$GITHUB_OUTPUT"
          echo "expected_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Expected Release Gate SHA: ${EXPECTED_SHA}"
          echo "Checked-out Release Gate SHA: ${actual_sha}"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Exact-head verification failed." >&2
            exit 1
          fi
          echo "Exact-head verification passed."

      - name: Classify exact diff scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ steps.verify-head.outputs.actual_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          docs_only=false
          arch_12f_01=false
          arch_12f_02a=false
          arch_12f_02b=false
          arch_12f_03=false
          arch_12f_04a=false
          arch_tenancy_01=false
          arch_integration=false
          pr_m3_fvs3=false
          pr_m3_fvs4=false
          pr_m3_fvs5=false
          pr_m3_fvs6=false
          pr_m3_sec_02=false
          pca_05r=false
          pca_05r_closure=false
          pca_06=false
          pca_07r=false
          pca_07r2=false
          pca_07_w2=false
          dca_02_bl2_envelope=false
          dca_02_bl2_preflight=false
          dca_02_bl2_r2_rebaseline=false
          changed_file_count=0

          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$base_sha" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "$base_sha..$HEAD_SHA")
            changed_file_count="${#changed_files[@]}"
            if [[ " ${changed_files[*]} " == *" run-arch-12f-01-config-hygiene-specs.ts "* ]]; then
              arch_12f_01=true
            fi
            if [[ " ${changed_files[*]} " == *" run-arch-12f-02a-identifier-externalization-specs.ts "* ]]; then
              arch_12f_02a=true
            fi
            if [[ " ${changed_files[*]} " == *" run-arch-12f-02b-runtime-tenant-identity-specs.ts "* ]]; then
              arch_12f_02b=true
            fi
            if [[ " ${changed_files[*]} " == *" run-arch-12f-03-official-workerd-harness-specs.mjs "* ]]; then
              arch_12f_03=true
            fi
            if [[ " ${changed_files[*]} " == *" run-arch-12f-04a-unsubscribe-log-redaction-specs.ts "* ]]; then
              arch_12f_04a=true
            fi
            if [[ " ${changed_files[*]} " == *" run-arch-tenancy-01-adr-specs.ts "* ]]; then
              arch_tenancy_01=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pr-m3-fvs3-property-inventory-read-only-specs.ts "* ]]; then
              pr_m3_fvs3=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pr-m3-fvs4-insights-visual-intelligence-specs.ts "* ]]; then
              pr_m3_fvs4=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pr-m3-fvs5-operations-read-only-specs.ts "* ]]; then
              pr_m3_fvs5=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pr-m3-fvs6-broker-team-directory-read-only-specs.ts "* ]]; then
              pr_m3_fvs6=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pr-m3-sec-02-public-surface-security-specs.ts "* ]]; then
              pr_m3_sec_02=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-05r-private-synthetic-rehearsal-envelope-specs.mjs "* ]]; then
              pca_05r=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-05r-prerequisite-closure-manifest-specs.mjs "* ]]; then
              pca_05r_closure=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-05r-synthetic-substrate-bundle-specs.mjs "* ]]; then
              pca_05r=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-05r-structural-wave-bundle-specs.mjs "* ]]; then
              pca_05r=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-06-same-backend-final-impact-requalification-specs.mjs "* ]]; then
              pca_06=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-07r-w1-postgres-name-array-type-corrective-specs.mjs "* ]]; then
              pca_07r=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-07r2-w1-forensic-forward-only-ledger-reconciliation-specs.mjs "* ]]; then
              pca_07r2=true
            fi
            if [[ " ${changed_files[*]} " == *" run-pca-07-w2-transport-safe-corrective-specs.mjs "* ]]; then
              pca_07_w2=true
            fi
            if [[ " ${changed_files[*]} " == *" run-dca-02-bl2-isolated-pitr-restore-envelope-specs.mjs "* ]]; then
              dca_02_bl2_envelope=true
            fi
            if [[ " ${changed_files[*]} " == *" run-dca-02-bl2-read-only-provider-preflight-cost-specs.mjs "* ]]; then
              dca_02_bl2_preflight=true
            fi
            if [[ " ${changed_files[*]} " == *" run-dca-02-bl2-r2-deferred-recoverability-rebaseline-specs.mjs "* ]]; then
              dca_02_bl2_r2_rebaseline=true
            fi
            if [[ "$changed_file_count" -eq 42 ]] \
              && [[ " ${changed_files[*]} " == *" run-arch-12f-01-config-hygiene-specs.ts "* ]] \
              && [[ " ${changed_files[*]} " == *" run-arch-12f-04a-unsubscribe-log-redaction-specs.ts "* ]] \
              && [[ " ${changed_files[*]} " == *" run-arch-tenancy-01-adr-specs.ts "* ]] \
              && [[ " ${changed_files[*]} " == *" run-arch-12f-04b-structured-log-specs.ts "* ]] \
              && [[ " ${changed_files[*]} " == *" run-dca-02-bl2-provider-identity-dr-specs.ts "* ]] \
              && [[ " ${changed_files[*]} " == *" run-dca-02-bl1-provider-orphan-recovery-specs.ts "* ]]; then
              arch_integration=true
            fi
            if [[ "$changed_file_count" -gt 0 ]]; then
              docs_only=true
              for path in "${changed_files[@]}"; do
                if [[ "$path" != docs/* ]]; then
                  docs_only=false
                  break
                fi
              done
            fi
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "arch_12f_01=$arch_12f_01" >> "$GITHUB_OUTPUT"
          echo "arch_12f_02a=$arch_12f_02a" >> "$GITHUB_OUTPUT"
          echo "arch_12f_02b=$arch_12f_02b" >> "$GITHUB_OUTPUT"
          echo "arch_12f_03=$arch_12f_03" >> "$GITHUB_OUTPUT"
          echo "arch_12f_04a=$arch_12f_04a" >> "$GITHUB_OUTPUT"
          echo "arch_tenancy_01=$arch_tenancy_01" >> "$GITHUB_OUTPUT"
          echo "arch_integration=$arch_integration" >> "$GITHUB_OUTPUT"
          echo "pr_m3_fvs3=$pr_m3_fvs3" >> "$GITHUB_OUTPUT"
          echo "pr_m3_fvs4=$pr_m3_fvs4" >> "$GITHUB_OUTPUT"
          echo "pr_m3_fvs5=$pr_m3_fvs5" >> "$GITHUB_OUTPUT"
          echo "pr_m3_fvs6=$pr_m3_fvs6" >> "$GITHUB_OUTPUT"
          echo "pr_m3_sec_02=$pr_m3_sec_02" >> "$GITHUB_OUTPUT"
          echo "pca_05r=$pca_05r" >> "$GITHUB_OUTPUT"
          echo "pca_05r_closure=$pca_05r_closure" >> "$GITHUB_OUTPUT"
          echo "pca_06=$pca_06" >> "$GITHUB_OUTPUT"
          echo "pca_07r=$pca_07r" >> "$GITHUB_OUTPUT"
          echo "pca_07r2=$pca_07r2" >> "$GITHUB_OUTPUT"
          echo "pca_07_w2=$pca_07_w2" >> "$GITHUB_OUTPUT"
          echo "dca_02_bl2_envelope=$dca_02_bl2_envelope" >> "$GITHUB_OUTPUT"
          echo "dca_02_bl2_preflight=$dca_02_bl2_preflight" >> "$GITHUB_OUTPUT"
          echo "dca_02_bl2_r2_rebaseline=$dca_02_bl2_r2_rebaseline" >> "$GITHUB_OUTPUT"
          echo "changed_file_count=$changed_file_count" >> "$GITHUB_OUTPUT"
          echo "Release Gate docs_only=$docs_only arch_12f_01=$arch_12f_01 arch_12f_02a=$arch_12f_02a arch_12f_02b=$arch_12f_02b arch_12f_03=$arch_12f_03 arch_12f_04a=$arch_12f_04a arch_tenancy_01=$arch_tenancy_01 arch_integration=$arch_integration pr_m3_fvs3=$pr_m3_fvs3 pr_m3_fvs4=$pr_m3_fvs4 pr_m3_fvs5=$pr_m3_fvs5 pr_m3_fvs6=$pr_m3_fvs6 pr_m3_sec_02=$pr_m3_sec_02 pca_05r=$pca_05r pca_05r_closure=$pca_05r_closure pca_06=$pca_06 pca_07r=$pca_07r pca_07r2=$pca_07r2 pca_07_w2=$pca_07_w2 dca_02_bl2_envelope=$dca_02_bl2_envelope dca_02_bl2_preflight=$dca_02_bl2_preflight dca_02_bl2_r2_rebaseline=$dca_02_bl2_r2_rebaseline changed_file_count=$changed_file_count"

      - name: Documentation governance validation
        if: steps.scope.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-documentation-governance.mjs \
            --base "${{ steps.scope.outputs.base_sha }}" \
            --head "${{ steps.verify-head.outputs.actual_sha }}" \
            2>&1 | tee release-gate.log

      - name: Setup Bun
        if: steps.scope.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile

      - name: Verify ARCH-12F-01 config hygiene
        if: steps.scope.outputs.arch_12f_01 == 'true'
        env:
          ARCH_12F_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          ARCH_12F_02A_MODE: ${{ steps.scope.outputs.arch_12f_02a }}
          ARCH_12F_02B_MODE: ${{ steps.scope.outputs.arch_12f_02b }}
          ARCH_12F_03_MODE: ${{ steps.scope.outputs.arch_12f_03 }}
          ARCH_INTEGRATION_MODE: ${{ steps.scope.outputs.arch_integration }}
          ARCH_INTEGRATION_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-12f-01

      - name: Verify PCA-05R private synthetic rehearsal envelope
        if: steps.scope.outputs.pca_05r == 'true'
        env:
          PCA_05R_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-05r

      - name: Verify PCA-05R prerequisite closure manifest
        if: steps.scope.outputs.pca_05r == 'true' || steps.scope.outputs.pca_05r_closure == 'true'
        env:
          PCA_05R_CLOSURE_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-05r:closure

      - name: Verify PCA-05R synthetic substrate bundle
        if: steps.scope.outputs.pca_05r == 'true'
        run: bun run test:pca-05r:substrate

      - name: Verify PCA-05R structural wave bundle
        if: steps.scope.outputs.pca_05r == 'true'
        run: bun run test:pca-05r:waves

      - name: Verify PCA-06 Same-Backend final impact requalification
        if: steps.scope.outputs.pca_06 == 'true'
        env:
          PCA_06_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-06

      - name: Verify PCA-07R W1 PostgreSQL name-array corrective
        if: steps.scope.outputs.pca_07r == 'true'
        env:
          PCA_07R_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-07r

      - name: Verify PCA-07R2 W1 forensic forward-only ledger reconciliation
        if: steps.scope.outputs.pca_07r2 == 'true'
        env:
          PCA_07R2_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-07r2

      - name: Verify PCA-07 W2 transport-safe atomic ledger-aware corrective
        if: steps.scope.outputs.pca_07_w2 == 'true'
        env:
          PCA_07_W2_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pca-07-w2

      - name: Verify DCA-02-BL2 isolated non-production PITR restore execution envelope
        if: steps.scope.outputs.dca_02_bl2_envelope == 'true'
        env:
          DCA02_BL2_ENVELOPE_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:dca-02-bl2:envelope

      - name: Verify DCA-02-BL2 read-only provider preflight and cost discovery
        if: steps.scope.outputs.dca_02_bl2_preflight == 'true'
        env:
          DCA02_BL2_PREFLIGHT_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:dca-02-bl2:preflight

      - name: Verify DCA-02-BL2 R2 deferred recoverability rebaseline
        if: steps.scope.outputs.dca_02_bl2_r2_rebaseline == 'true'
        env:
          DCA02_BL2_R2_REBASELINE_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:dca-02-bl2:r2-rebaseline

      - name: Verify ARCH-12F-02A infrastructure identifier externalization
        if: steps.scope.outputs.arch_12f_02a == 'true'
        env:
          ARCH_12F_02A_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-12f-02a

      - name: Verify ARCH-12F-02B runtime tenant domain and sender externalization
        if: steps.scope.outputs.arch_12f_02b == 'true'
        env:
          ARCH_12F_02B_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          RM_PRIME_EMAIL_SITE_NAME: RM Prime CI
          RM_PRIME_EMAIL_SENDER_DOMAIN: mail.ci.example.test
          RM_PRIME_EMAIL_FROM_DOMAIN: ci.example.test
          RM_PRIME_AUTH_SITE_ORIGIN: https://ci.example.test
        run: bun run test:arch-12f-02b

      - name: Verify ARCH-12F-03 official workerd single-dispatch harness
        if: steps.scope.outputs.arch_12f_03 == 'true'
        env:
          ARCH_12F_03_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-12f-03

      - name: Verify ARCH-12F-04A unsubscribe log redaction
        if: steps.scope.outputs.arch_12f_04a == 'true'
        env:
          ARCH_12F_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          ARCH_INTEGRATION_MODE: ${{ steps.scope.outputs.arch_integration }}
          ARCH_INTEGRATION_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-12f-04a

      - name: Verify ARCH-TENANCY-01 Pool ADR
        if: steps.scope.outputs.arch_tenancy_01 == 'true'
        env:
          ARCH_TENANCY_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          ARCH_INTEGRATION_MODE: ${{ steps.scope.outputs.arch_integration }}
          ARCH_INTEGRATION_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-tenancy-01

      - name: Verify PRM3-P0A frontend entry contract
        if: steps.scope.outputs.docs_only != 'true'
        run: bun run test:prm3-p0a

      - name: Verify PR-M3-FVS3 authenticated property inventory read-only
        if: steps.scope.outputs.pr_m3_fvs3 == 'true'
        env:
          PR_M3_FVS3_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pr-m3-fvs3

      - name: Verify PR-M3-FVS4 authenticated insights and visual intelligence read-only
        if: steps.scope.outputs.pr_m3_fvs4 == 'true'
        env:
          PR_M3_FVS4_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pr-m3-fvs4

      - name: Verify PR-M3-FVS5 authenticated operations read-only
        if: steps.scope.outputs.pr_m3_fvs5 == 'true'
        env:
          PR_M3_FVS5_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pr-m3-fvs5

      - name: Verify PR-M3-FVS6 authenticated broker and team directory read-only
        if: steps.scope.outputs.pr_m3_fvs6 == 'true'
        env:
          PR_M3_FVS6_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pr-m3-fvs6

      - name: Verify PR-M3-SEC-02 public surface security hardening
        if: steps.scope.outputs.pr_m3_sec_02 == 'true'
        env:
          PR_M3_SEC_02_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:pr-m3-sec-02

      - name: Verify release gate
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        env:
          ARCH_INTEGRATION_MODE: ${{ steps.scope.outputs.arch_integration }}
          ARCH_INTEGRATION_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          PR_M3_SEC_02_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: |
          set -o pipefail
          bun run verify:release 2>&1 | tee release-gate.log

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ steps.verify-head.outputs.actual_sha }}
          path: |
            release-gate.log
            documentation-governance-evidence.json
          if-no-files-found: error
          retention-days: 14
