name: Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build and deterministic route generation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      CRON_SECRET: ci-placeholder-secret
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        id: verify-head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "actual_sha=${actual_sha}" >> "$GITHUB_OUTPUT"
          echo "expected_sha=${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"
          echo "Expected Release Gate SHA: ${EXPECTED_SHA}"
          echo "Checked-out Release Gate SHA: ${actual_sha}"
          if [[ "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "Exact-head verification failed." >&2
            exit 1
          fi
          echo "Exact-head verification passed."

      - name: Classify exact diff scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ steps.verify-head.outputs.actual_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi

          docs_only=false
          arch_12f_04a=false
          changed_file_count=0

          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] \
            && [[ "$base_sha" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "$base_sha..$HEAD_SHA")
            changed_file_count="${#changed_files[@]}"
            if [[ " ${changed_files[*]} " == *" run-arch-12f-04a-unsubscribe-log-redaction-specs.ts "* ]]; then
              arch_12f_04a=true
            fi
            if [[ "$changed_file_count" -gt 0 ]]; then
              docs_only=true
              for path in "${changed_files[@]}"; do
                if [[ "$path" != docs/* ]]; then
                  docs_only=false
                  break
                fi
              done
            fi
          fi

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "arch_12f_04a=$arch_12f_04a" >> "$GITHUB_OUTPUT"
          echo "changed_file_count=$changed_file_count" >> "$GITHUB_OUTPUT"
          echo "Release Gate docs_only=$docs_only arch_12f_04a=$arch_12f_04a changed_file_count=$changed_file_count"

      - name: Documentation governance validation
        if: steps.scope.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-documentation-governance.mjs \
            --base "${{ steps.scope.outputs.base_sha }}" \
            --head "${{ steps.verify-head.outputs.actual_sha }}" \
            2>&1 | tee release-gate.log

      - name: Setup Bun
        if: steps.scope.outputs.docs_only != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: bun install --frozen-lockfile

      - name: Verify ARCH-12F-04A unsubscribe log redaction
        if: steps.scope.outputs.arch_12f_04a == 'true'
        env:
          ARCH_12F_BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: bun run test:arch-12f-04a

      - name: Verify release gate
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -o pipefail
          bun run verify:release 2>&1 | tee release-gate.log

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ steps.verify-head.outputs.actual_sha }}
          path: |
            release-gate.log
            documentation-governance-evidence.json
          if-no-files-found: error
          retention-days: 14
