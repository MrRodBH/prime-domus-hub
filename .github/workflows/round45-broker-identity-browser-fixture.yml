name: Round 45 isolated fixture integrity (not browser approval)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fixture-integrity:
    name: Round 45 fixture integrity only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: ROUND45_OUTPUT="$RUNNER_TEMP/round45-browser" node tests/round45/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: round45-isolated-fixture-not-browser-evidence
          path: ${{ runner.temp }}/round45-browser
          retention-days: 14
