name: P0 Visual Product Homologation Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/demo/**"
      - "src/routes/demonstracao.tsx"
      - "src/routes/design-system.tsx"
      - "src/routes/auth.tsx"
      - "src/components/workspace/contexts.ts"
      - "src/components/dashboard/DashboardInsightFeed.tsx"
      - "src/components/dashboard/DashboardVisualizations.tsx"
      - "src/lib/public-tenant-read-guards.ts"
      - "src/lib/__tests__/public-settings-campaign-read-recovery.spec.ts"
      - "src/lib/error-page.ts"
      - "src/routes/__root.tsx"
      - "src/routeTree.gen.ts"
      - "run-p0-visual-product-homologation-specs.ts"
      - "package.json"
      - ".github/workflows/p0-visual-product-homologation-gate.yml"

permissions:
  contents: read

concurrency:
  group: p0-visual-product-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-product:
    name: PT-BR, responsive UI and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      CRON_SECRET: ci-placeholder-secret

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Validate visual product surface
        run: |
          bun run test:p0-visual
          bun run test:psg-01:tenant-reads
          bun run typecheck
          bun run build
