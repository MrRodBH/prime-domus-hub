name: Round 43 native broker identity concurrency
on:
  pull_request:
    branches: [main]
    paths:
      - "tests/round43/**"
      - "run-round-43-broker-identity-concurrency-specs.mjs"
      - ".github/workflows/round43-broker-identity-concurrency.yml"
      - "src/lib/api/tenant-broker-directory.functions.ts"
      - "supabase/migrations/**"
permissions:
  contents: read
jobs:
  native-concurrency:
    name: Native PostgreSQL independent-session concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: round43
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55443:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d round43"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact head and immutable production scope
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test -z "$(git diff --name-only 715f9f9ca071fa0e48a03792d7fc33517027f17b HEAD -- src/lib/api/tenant-broker-directory.functions.ts supabase/migrations/20260907183824_round42_broker_identity_link.sql supabase/migrations/20260828160617_pca_07r2_w1_forensic_forward_only_ledger_reconciliation.sql supabase/migrations/20260713221723_857275c9-958d-46fc-b826-e0c7ae030a3d.sql)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Install test-only native PostgreSQL transport
        run: npm install --prefix "$RUNNER_TEMP/round43-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Run independent sessions against local ephemeral service
        env:
          ROUND43_ISOLATED_CI: "true"
        run: ROUND43_PG_MODULE="$RUNNER_TEMP/round43-pg/node_modules/pg/lib/index.js" node run-round-43-broker-identity-concurrency-specs.mjs
      - name: Upload session, lock and SQL-source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round43-native-concurrency-${{ github.event.pull_request.head.sha }}
          path: round43-evidence.json
          if-no-files-found: error
      - run: bun run typecheck
