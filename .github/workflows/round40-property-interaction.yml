name: Round 40 controlled property interaction
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  controlled-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/round40-dom" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - run: ROUND40_JSDOM_MODULE="$RUNNER_TEMP/round40-dom/node_modules/jsdom/lib/api.js" node run-round-40-property-interaction-specs.mjs
      - run: bunx tsc --noEmit
