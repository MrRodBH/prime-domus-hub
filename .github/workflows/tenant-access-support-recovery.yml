name: Tenant access and support recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: recovery
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:55452:5432"]
        options: --health-cmd "pg_isready -U postgres -d recovery" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/recovery" --ignore-scripts --no-audit --no-fund pg@8.16.3 jsdom@26.1.0
      - name: Isolated roles and database security tests
        env:
          ROUND52_ISOLATED_CI: "true"
        run: |
          psql -h 127.0.0.1 -p 55452 -U postgres -d recovery -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          ROUND52_PG_MODULE="$RUNNER_TEMP/recovery/node_modules/pg/lib/index.js" node tests/support-recovery/database.mjs
      - run: node tests/support-recovery/runtime.mjs
      - run: ROUND52_JSDOM_MODULE="$RUNNER_TEMP/recovery/node_modules/jsdom/lib/api.js" node run-round-56-approved-navigation-specs.mjs
      - run: bun run test:p0-website-builder
      - run: bun run typecheck
      - run: bun run build
