name: CMS website recovery
on:
  pull_request:
    paths:
      - 'src/components/site-builder/**'
      - 'src/components/site/CmsPreviewOverlay.tsx'
      - 'src/lib/website-*.ts'
      - 'src/lib/api/site-versions.functions.ts'
      - 'src/lib/api/tenant-configuration*.ts'
      - 'supabase/migrations/20260914210012_7fdd3240-0b97-4fdd-8c5e-9cc92af6d9ba.sql'
      - 'run-cms-website-recovery-specs.mjs'
      - '.github/workflows/cms-website-recovery.yml'
permissions:
  contents: read
jobs:
  recovery-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: npm install --prefix "$RUNNER_TEMP/cms-test" --no-audit --no-fund jsdom@26.1.0
      - name: Private preview, safe save and owner-approved navigation
        run: |
          ROUND52_JSDOM_MODULE="$RUNNER_TEMP/cms-test/node_modules/jsdom/lib/api.js" node run-cms-website-recovery-specs.mjs
          ROUND52_JSDOM_MODULE="$RUNNER_TEMP/cms-test/node_modules/jsdom/lib/api.js" node run-round-56-approved-navigation-specs.mjs
          node --import tsx/esm run-pr-m2-configuration-center-specs.ts
          node --import tsx/esm run-pr-m2-analytics-tracking-conversion-events-functional-completion-specs.ts
      - run: bun run typecheck
      - run: bun run build
