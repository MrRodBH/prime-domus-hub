name: WRI-01 Worker Runtime Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "vite.config.ts"
      - "package.json"
      - "bun.lock"
      - "wrangler.jsonc"
      - "src/server.ts"
      - "src/lib/runtime/**"
      - "src/types/cloudflare-runtime.d.ts"
      - "scripts/verify-wri-01-worker-bundle.mjs"
      - "scripts/verify-release.mjs"
      - "run-wri-01-cloudflare-worker-runtime-specs.ts"
      - ".github/workflows/wri-01-worker-runtime-gate.yml"
      - "docs/architecture/impact-analysis/WRI-01-cloudflare-worker-runtime-integration-impact-analysis.md"
      - "docs/architecture/governance/WRI-01-cloudflare-worker-runtime-integration-execution-envelope.md"
      - "docs/architecture/ROADMAP_ARCHITECTURAL.md"
      - "docs/architecture/governance/FINITE_ROADMAP_EXECUTION_MAP.md"
      - "docs/delivery/product-roadmap/pre-homologation-product-readiness/evidence/dca-01-implementation-execution.md"
      - "docs/delivery/product-roadmap/pre-homologation-product-readiness/evidence/wri-01-implementation-execution.md"
      - "docs/operations/WRI-01-cloudflare-worker-runtime-runbook.md"
  push:
    branches:
      - "agent/wri-01-cloudflare-worker-runtime"

permissions:
  contents: read

concurrency:
  group: wri-01-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Frozen install
        run: bun install --frozen-lockfile

      - name: WRI-01 deterministic specifications
        run: bun run test:wri-01

      - name: DCA-01 regression specifications
        run: bun run test:dca-01

      - name: Exact production build
        run: bun run build

      - name: Typecheck after deterministic route generation
        run: bun run typecheck

      - name: Compiled Worker bundle audit
        run: bun run wri01:bundle-audit

      - name: Preserve bundle-audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wri-01-bundle-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: .wri01-bundle-audit-diagnostic.json
          if-no-files-found: warn
          retention-days: 14

      - name: Wrangler deterministic dry-run
        run: bun run wri01:dry-run

      - name: Local workerd scheduled-event proof
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="${RUNNER_TEMP}/wri01-workerd.log"
          bunx wrangler@4.114.0 dev \
            --local \
            --test-scheduled \
            --env homologation \
            --port 8788 \
            --var SUPABASE_URL:http://127.0.0.1:9 \
            --var SUPABASE_SERVICE_ROLE_KEY:wri01-local-proof \
            --var CLOUDFLARE_API_TOKEN_DCA01_HML:wri01-local-proof \
            >"${LOG_FILE}" 2>&1 &
          WRANGLER_PID=$!
          cleanup() {
            kill "${WRANGLER_PID}" 2>/dev/null || true
            wait "${WRANGLER_PID}" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=false
          for _ in $(seq 1 45); do
            if grep -Eq "Ready on|Ready at|Listening" "${LOG_FILE}"; then
              READY=true
              break
            fi
            if ! kill -0 "${WRANGLER_PID}" 2>/dev/null; then
              cat "${LOG_FILE}"
              exit 1
            fi
            sleep 1
          done
          if [ "${READY}" != "true" ]; then
            cat "${LOG_FILE}"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            "http://127.0.0.1:8788/__scheduled?cron=%2A%2F5+%2A+%2A+%2A+%2A" \
            -o "${RUNNER_TEMP}/wri01-scheduled-response.txt"
          sleep 5
          cat "${LOG_FILE}"
          grep -Eq "\[DCA-01\] scheduled reconciliation (completed|failed closed)" "${LOG_FILE}"
